schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Open Daycare: aplicación web de gestión de guarderías (multi-tenant).
  El personal de la guardería registra niños, crea publicaciones del feed (fotos, avisos)
  y resúmenes del día; las familias vinculadas consultan el perfil de sus hijos,
  el resumen diario y el feed familiar. Los padres solo ven datos de sus propios niños.
  Tech stack: Next.js 16 (App Router), React 19, TypeScript (strict), Tailwind CSS v4.
  Backend: Supabase (Auth, Postgres, migraciones locales en supabase/migrations/).
  UI en español; código, DB y enums en inglés.

